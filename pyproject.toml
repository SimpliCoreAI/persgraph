[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "second-brain"
version = "0.1.0"
description = "Personal second brain — private RAG over your docs, notes, emails, and more"
requires-python = ">=3.9"
dependencies = [
    "pypdf>=4.0.0",
    "chromadb>=0.5.0",
    "ollama>=0.2.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",          # Pretty terminal output
    "typer>=0.12.0",         # CLI framework
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
sb-ingest = "scripts.ingest:app"
sb-query = "scripts.query:app"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
